  txt(`/ ${QN * 100}点`, W / 2 + 70, 112, 16, C.ink, { align: 'left' });
  if (s > 1.3) { // ランクのはんこ
    const k = clamp((s - 1.3) / 0.18, 0, 1), sc = 1 + (1 - k) * 1.2, x = 62, y = 178;
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.15); ctx.scale(sc, sc); ctx.globalAlpha = k;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 38, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = C.red; ctx.lineWidth = 6; ctx.stroke();
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 31, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    txt(rk[1], x, y + 2, 42 * sc, C.red, { a: k, rot: -0.15 });
    txt(rk[2], 116, 166, 21, C.ink, { align: 'left', a: k });
    txt(rk[3], 116, 194, 12.5, C.ink, { align: 'left', a: k, w: 500 });
  }
  const y0 = 234, rowH = Math.min(40, (H - y0 - 230) / QN + 0);
  panel(12, y0, W - 24, rowH * QN + 44, 16, '#fff', C.ink, 3);
  txt(avg.length ? `平均ズレ ${(avg.reduce((a, b) => a + b, 0) / avg.length).toFixed(1)}%` : '平均ズレ ー', W / 2, y0 + 20, 15, C.ink);
  G.res.forEach((c, i) => {
    const y = y0 + 44 + i * rowH + rowH / 2 - 4, a = ease((s - 0.2 - i * 0.08) / 0.3);
    txt(c.th.ic, 36, y, 20, '#000', { a }); txt(c.th.name, 56, y, fitSize(c.th.name, 14.5, W - 98 - 72 - 56 - 6), C.ink, { align: 'left', a });
    txt(c.timeout ? '時間切れ' : `ズレ ${c.dev.toFixed(1)}%`, W - 98, y, 13, C.gray, { align: 'right', a, w: 500 });
    txt(`${c.score}点`, W - 26, y, 17, c.score >= 90 ? C.red : C.ink, { align: 'right', a });
  });
  if (G.newBest && s > 1.6) txt('ベスト更新！', W - 70, 62, 16, C.red, { stroke: '#fff', sw: 5, rot: 0.12, sc: 1 + Math.sin(G.t * 6) * 0.05 });
  if (G.custom) txt('選んだお題', W - 62, 62, 14, C.ink, { stroke: '#fff', sw: 5, rot: 0.12 });
  if (G.nw) newTag(52, 32, 1, -0.08);   // 「NEW」モードの目印
  const b = resultBtns();
  if (s > 1.6) { // お題の進みぐあい
    const yy = b.share.y - 19, m1 = `🎉 ${unlockWord()}クリア！ お題を選べるようになった！`, m2 = `🎉 新しいお題${NEW_THEMES.length}種 全部遊んだ！`;
    if (G.justAll) txt(m1, W / 2, yy, fitSize(m1, 15, W - 28), C.red, { stroke: '#fff', sw: 5, sc: 1 + Math.sin(G.t * 6) * 0.025 });
    else if (G.justNew) txt(m2, W / 2, yy, fitSize(m2, 15, W - 28), C.red, { stroke: '#fff', sw: 5, sc: 1 + Math.sin(G.t * 6) * 0.025 });
    else if (G.nw && !newDone()) txt(`新しいお題：あと${newLeft()}種`, W / 2, yy, 12, C.ink, { w: 500 });
    else if (!G.all && !G.custom) txt(`お題を選べるまで あと${unlockLeft()}種（${unlockWord()}遊ぶと開く）`, W / 2, yy, 12, C.ink, { w: 500 });
  }
  if (s > 0.9) {
    button(b.share, 'Xでシェア', C.ink, '#fff', 19); button(b.retry, 'もう一度', C.red, '#fff', 19);
    const ml = G.custom ? 'お題を選びなおす' : 'タイトルへ', mw = G.custom ? 110 : 68;
    txt(ml, b.menu.x + b.menu.w / 2, b.menu.y + b.menu.h / 2, 14, C.ink, { w: 500 });
    ctx.fillStyle = C.ink; ctx.fillRect(b.menu.x + b.menu.w / 2 - mw / 2, b.menu.y + b.menu.h / 2 + 10, mw, 1.5);
  }
}
function resultBtns() { const y = H - 150; return { share: { x: 18, y, w: 156, h: 54 }, retry: { x: W - 18 - 156, y, w: 156, h: 54 }, menu: { x: W / 2 - 70, y: y + 66, w: 140, h: 34 } }; }

function render() {
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0); bg();
  if (G.shake > 0) { const a = G.shake * 12; ctx.translate((Math.random() - 0.5) * a, (Math.random() - 0.5) * a); }
  if (G.state === 'title') drawTitle(); else if (G.state === 'select') drawSelect(); else if (G.state === 'result') drawResult(); else drawPlay();
}

// ================= 入力 =================
const inBox = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
function shareX() {
  const url = /^https?:/.test(location.protocol) && location.hostname.endsWith('github.io') ? location.origin + location.pathname : URL_PUBLIC;
  const rk = rankOf(G.total), dv = G.res.filter(c => !c.timeout).map(c => c.dev), avg = dv.length ? (dv.reduce((a, b) => a + b, 0) / dv.length).toFixed(1) : 'ー';
  const msg = `ニッポン真っ二つ${G.custom ? '（お題を選んで挑戦）' : G.nw ? `（新しいお題${NEW_THEMES.length}種）` : ''}で ${G.total}点（ランク${rk[1]}・${rk[2]}）！\n平均ズレ ${avg}%\nあなたは日本を ちょうど半分に切れる？\n#ニッポン真っ二つ`;
  const u = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(msg) + '&url=' + encodeURIComponent(url);
  const w = window.open(u, '_blank'); if (!w) location.href = u;
}
let ptr = null;
function onDown(x, y, id) {
  audioInit();
  if (G.state === 'title') {
    if (Math.hypot(x - (W - 22), y - 24) < 22) { muted = !muted; store.set('mp_mute', muted); return; }
    if (inBox(L.pick, x, y)) { SFX.click(); if (G.all) openSelect(); else G.toast = { s: `${unlockWord()}のお題を遊ぶと 選べるよ（あと${unlockLeft()}種）`, t: G.t }; return; }
    if (G.ret && inBox(L.nw, x, y)) { SFX.click(); startGame(null, true); return; }   // 「NEW」ボタン
    if (inBox(L.start, x, y) || inBox(L.tBoard, x, y)) { SFX.click(); startGame(); }
    return;
  }
  if (G.state === 'select') {
    const l = selLay();
    if (inBox(l.back, x, y)) { SFX.click(); setState('title'); return; }
    if (inBox(l.go, x, y)) { if (SEL.pick.length === QN) { SFX.click(); startGame(SEL.pick); } return; }
    const tb = tabLay().find(t => x >= t.x - 2 && x <= t.x + t.w + 2 && y >= t.y - 6 && y <= t.y + t.h + 4);   // ジャンルのタブ（少し広めに反応）
    if (tb) { if (tb.g !== SEL.g) { SEL.g = tb.g; SEL.sy = 0; SEL.vy = 0; SEL.drag = null; SFX.click(); } return; }   // 別の指で一覧を押さえたままタブを切りかえても、まちがって選ばれないように drag を消す
    if (y >= l.top && y <= l.bot && !SEL.drag) { SEL.drag = { id, x0: x, y0: y, sy0: SEL.sy, moved: false, ly: y, lt: now(), v: 0 }; SEL.vy = 0; }
    return;
  }
  if (G.state === 'cut') { if (ptr === null) { ptr = id; G.drag = { x0: x, y0: y, x1: x, y1: y, len: 0 }; } return; }
  if (G.state === 'reveal') { if (since() > 1.6 && inBox(L.next, x, y)) { SFX.click(); nextQ(); } return; }
  if (G.state === 'result' && since() > 0.9) {
    const b = resultBtns();
    if (inBox(b.share, x, y)) shareX(); else if (inBox(b.retry, x, y)) { SFX.click(); startGame(G.custom ? G.qs : null, G.nw); } else if (inBox(b.menu, x, y)) { SFX.click(); if (G.custom) openSelect(); else setState('title'); }
  }
}
function onMove(x, y, id) {
  if (SEL.drag && id === SEL.drag.id) { // お題一覧のスクロール
    const d = SEL.drag, dy = y - d.y0, t = now(), dtt = Math.max(0.004, t - d.lt);
    if (Math.abs(dy) > 8) d.moved = true; if (d.moved) SEL.sy = clamp(d.sy0 - dy, 0, selLay().max);
    d.v = 0.6 * d.v + 0.4 * (-(y - d.ly) / dtt); d.ly = y; d.lt = t; return;
  }
  if (G.state === 'cut' && G.drag && id === ptr) { G.drag.x1 = x; G.drag.y1 = y; G.drag.len = Math.hypot(x - G.drag.x0, y - G.drag.y0); }
}
function onUp(x, y, id) {
  if (SEL.drag && id === SEL.drag.id) {
    const d = SEL.drag; SEL.drag = null; if (G.state !== 'select') return;
    if (d.moved) { SEL.vy = now() - d.lt < 0.08 ? clamp(d.v, -2600, 2600) : 0; return; }   // スクロールした時は選ばない
    const l = selLay(), list = selList(), i = list.findIndex((t, j) => inBox(selCell(j, l), x, y)); if (i < 0 || y < l.top || y > l.bot) return;
    const k = SEL.pick.indexOf(list[i]);
    if (k >= 0) { SEL.pick.splice(k, 1); SFX.click(); } else if (SEL.pick.length < QN) { SEL.pick.push(list[i]); SFX.click(); } else SEL.warn = G.t;
    return;
  }
  if (id !== ptr) return; ptr = null;
  if (G.state === 'cut' && G.drag) { onMove(x, y, id); const d = G.drag; G.drag = null; if (d.len >= MIN_SWIPE) doCut(d.x0, d.y0, d.x1, d.y1); }
}
const lx = e => (e.clientX - OX) / S, ly = e => (e.clientY - OY) / S;
cv.addEventListener('pointerdown', e => { e.preventDefault(); onDown(lx(e), ly(e), e.pointerId); });
window.addEventListener('pointermove', e => { onMove(lx(e), ly(e), e.pointerId); });
window.addEventListener('pointerup', e => { onUp(lx(e), ly(e), e.pointerId); });
window.addEventListener('pointercancel', e => { if (e.pointerId === ptr) { ptr = null; G.drag = null; } if (SEL.drag && e.pointerId === SEL.drag.id) SEL.drag = null; });
cv.addEventListener('wheel', e => { if (G.state === 'select') { e.preventDefault(); SEL.vy = 0; SEL.sy = clamp(SEL.sy + e.deltaY / S, 0, selLay().max); } }, { passive: false });   // パソコンのホイール
document.addEventListener('touchend', audioInit, { passive: true });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

// ================= ループ =================
resize();
let last = performance.now();
function frame(nw) { requestAnimationFrame(frame); const dt = Math.max(0, Math.min(0.05, (nw - last) / 1000)); last = nw; update(dt); render(); }
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) {
  const t = THEMES.map(x => x.name + x.tip + x.src).join('') + RANKS.map(r => r.join('')).join('') + JUDGE.map(j => j[1]).join('') +
    'ニッポン真っ二つお題がちょうど半分になるように日本をまっすぐ切れ！スタートランダム問・秒ベスト点第結果発表平均ズレ時間切れ次の問題へタイトルもう一度でシェア指をはなすと切れるスワイプで線を引いて切ろう向きでもOK本正解の出典更新ー0123456789.%/お題を選ぶもどるこのつであとえらぼう選べるのはまで全種遊ぶと開くクリアようになった挑戦なおす進まだ出ていない生産量消費量数回全部特産品消費お店自然・乗物人・文化あそぶ選べるまで開くNEW新しい遊んだ';
  document.fonts.load(`800 20px "M PLUS Rounded 1c"`, t).catch(() => { }); document.fonts.load(`500 20px "M PLUS Rounded 1c"`, t).catch(() => { });
}
// テスト用（遊びには影響しません）
window.__mp = { G, L, MAP, THEMES, share, halfC, weights, doCut, startGame, nextQ, sx, sy, kx, ky, NC: () => NC, fitMap, SEL, selLay, selCell, openSelect, pickThemes, markSeen, leftCount, store, setState, GENRES, UNLOCK_N, unlockLeft, selList, tabLay, NEW_THEMES, newSeen, newLeft, newDone, layout };
})();
